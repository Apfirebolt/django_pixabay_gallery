{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Django Gallery{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato&family=Nunito&family=PT+Sans&family=Roboto&display=swap"
      rel="stylesheet"
    />

    <!-- Modern Tailwind CSS CDN -->
    <link rel="stylesheet" href="{% static 'css/output.css' %}" />

    <!-- Tailwind Configuration for CDN -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                light: '#67e8f9',
                DEFAULT: '#0891b2',
                dark: '#164e63',
              },
              accent: '#f43f5e',
              primary: '#0891b2',
            }
          }
        }
      }
    </script>

    <!-- Import Map: Enables clean `import { createApp } from 'vue'` in any static JS file -->
    <script type="importmap">
      {
        "imports": {
          "vue": "https://cdn.jsdelivr.net/npm/vue@3/dist/vue.esm-browser.js"
        }
      }
    </script>

    {% block head %}{% endblock %}
  </head>
  <body class="bg-gray-100 min-h-screen text-slate-800">
    <!-- Vue Mount Root (Contains ONLY template markup, NO script blocks) -->
    <div id="app">
      {% block content %}{% endblock %}
    </div>

    <!-- Scripts placed strictly OUTSIDE the Vue mounting root -->
    {% block scripts %}{% endblock %}
  </body>
</html>
